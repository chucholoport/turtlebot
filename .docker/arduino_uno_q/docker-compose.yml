services:

  ros2:
    build:
      context: ../..
      dockerfile: .docker/arduino_uno_q/Dockerfile

    hostname: chucholoport
    extra_hosts:
      - "chucholoport:127.0.0.1"

    container_name: turtlebot
    network_mode: host
    stdin_open: true
    tty: true
    
    volumes:
      - ../../turtle_ws:/turtle_ws
      - ../../test/msgpack_test.py:/test/msgpack_test.py
      - /var/run/arduino-router.sock:/var/run/arduino-router.sock

    environment:
      ROS_DOMAIN_ID: 0

    privileged: true